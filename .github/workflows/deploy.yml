name: Deploy to AWS ECS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

# Keep these values aligned with infra/variables.tf and the Terraform project_name.
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ledger-api-cloud
  ECS_CLUSTER: ledger-api-cloud
  ECS_SERVICE: ledger-api-cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run PostgreSQL-backed tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ledger
          SPRING_DATASOURCE_USERNAME: ledger
          SPRING_DATASOURCE_PASSWORD: ledger
          JWT_SECRET: ci-test-secret-that-is-long-enough-for-hmac-sha-256
        run: mvn -B verify

      # AWS resources are created separately by Terraform. Until the role ARN
      # is saved as a GitHub Actions secret, keep CI green and skip deployment.
      - name: Check AWS deployment configuration
        id: aws-config
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        shell: bash
        run: |
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS deployment skipped. Apply infra/ with Terraform, then add the github_actions_role_arn output as the AWS_DEPLOY_ROLE_ARN repository secret."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials using OIDC
        if: steps.aws-config.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.aws-config.outputs.ready == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.aws-config.outputs.ready == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy latest image to ECS
        if: steps.aws-config.outputs.ready == 'true'
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment
